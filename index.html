<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultScope — Hosting &amp; Infrastructure</title>
    <meta name="description" content="VaultScope is a hosting and infrastructure company. Cloud VPS and Dedicated Servers — built on a modern, self-hosted technology stack." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vaultscope.de" />
    <meta property="og:title" content="VaultScope — Hosting &amp; Infrastructure" />
    <meta property="og:description" content="VaultScope is a hosting and infrastructure company. Cloud VPS and Dedicated Servers — built on a modern, self-hosted technology stack." />
    <meta property="og:site_name" content="VaultScope" />
    <meta property="og:image" content="https://vaultscope.de/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VaultScope — Hosting &amp; Infrastructure" />
    <meta name="twitter:description" content="VaultScope is a hosting and infrastructure company. Cloud VPS and Dedicated Servers — built on a modern, self-hosted technology stack." />
    <meta name="twitter:image" content="https://vaultscope.de/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://vaultscope.de" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme: apply before first paint to prevent flash -->
    <script>
      try {
        var stored = localStorage.getItem('vs-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
